name: Factris
description: Factris is a European fintech that provides invoice financing (factoring)
  for small and medium-sized enterprises, converting unpaid B2B invoices into working
  capital within 24 hours. Its services span invoice financing, debtor management and
  collections, credit insurance, and credit-risk assessment, delivered through the
  self-service FAB platform where customers upload invoices and track payments. Factris
  operates across the Netherlands, Lithuania, and other European markets and has financed
  over two billion euros in receivables. This profile was surfaced as a portfolio company
  of Speedinvest and is being enriched in the API Evangelist network; Factris publishes
  no public developer API or documentation at this time.
